name: 不具合の報告
description: 起動・プレイ・保存に関する不具合
title: "[不具合] "
body:
  - type: markdown
    attributes:
      value: "再現した状況を教えてください。BIOSや他作品のROMは添付しないでください。"
  - type: input
    id: version
    attributes:
      label: ゲームの版
      placeholder: "v0.61"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 使用環境
      description: エミュレーター名・バージョン・OS、または実機の機器構成
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: 曲とプレイ設定
      description: 曲名、EASY／HARD、RANDOM ON／OFF。起動前の問題なら「起動前」と記載してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順と実際に起きたこと
      description: 期待した動作と、実際の動作を記載してください。
    validations:
      required: true
